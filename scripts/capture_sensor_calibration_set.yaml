id: capture_sensor_calibration_set
name: Capture the bias + flat-dark portion of a sensor calibration set at one gain/offset
description: >
  Captures biasCount bias frames and darkCount flat-dark frames — a dark frame at the
  same exposure as a flat, needed to separate read/dark-current noise from photon shot
  noise in a photon-transfer-curve analysis — at a single gain/offset setting
  (INDIMCP-81/102). Deliberately excludes flat frames themselves: unlike bias/dark,
  a flat needs a light source physically staged in front of the optics, which this
  script engine has no way to do or verify (see docs/SensorCalibration.md's
  "Decision: split capture into a bias/flat-dark script and a separate flat script").
  Flats are captured separately, once the operator has staged that light source, by
  capture_flat_sequence — this script is the half of the calibration set that can run
  fully unattended, with no manual precondition. This is the per-setting building
  block for a full sweep: sweeping gain/offset/exposure across settings is done by a
  caller (or the run_sensor_calibration_sweep MCP tool, INDIMCP-102) invoking this
  script once per setting (there's no list-valued script parameter or loop-index
  arithmetic available — see docs/ScriptSchema.md's closed step vocabulary), not by
  this script looping over a range itself. This script only captures and stores
  frames; computing a sensor profile from them is a separate, later step outside the
  script engine — see docs/SensorAnalysis.md for the theory.

  Flat-dark exposure ordering: flat-dark frames must be captured before the flat
  panel this setting's flats will use is ever staged — a panel that's on, or merely
  leaking light nearby, contaminates a "dark" frame. This script never verifies that
  (most rigs have no queryable flat-panel device to check against; see
  docs/SensorCalibration.md's "Flat-dark" section) — it is the caller's
  responsibility to run this script before staging that panel for the matching flat
  capture.

  Deliberately skips mount positioning, filter selection, and focus, like
  capture_bias_sequence and capture_dark_sequence — a calibration frame's
  illumination/focus source is whatever the rig is already pointed at when this runs.
  Pausable: capture_frame is the only step inside each repeat loop, so a pause request
  only ever lands between frames, never mid-exposure.

  binningX/binningY/frameX/frameY/frameWidth/frameHeight (INDIMCP-126) are optional,
  same defaults/omit convention as capture_frame.yaml itself: binning defaults to
  1x1, and the sub-frame fields default to omitted (full sensor) — set all four
  together, or omit all four. Held at a single setting for both the bias and
  flat-dark frames in this set, same as gain/offset — must match the light frames
  this calibration set calibrates.
pausable: true
parameters:
  gain:
    type: number
    required: false
    description: Sensor gain to hold for every frame in this set. Omit to leave the device's current setting alone.
  offset:
    type: number
    required: false
    description: Sensor offset to hold for every frame in this set. Omit to leave the device's current setting alone.
  biasExposureSeconds:
    type: number
    required: false
    default: 0.0
    description: Exposure length per bias frame, in seconds — normally the camera's shortest supported exposure.
  flatExposureSeconds:
    type: number
    required: true
    description: >
      Exposure length per flat-dark frame, in seconds — matching the exposure length
      of the flat frames (captured separately, by capture_flat_sequence) this
      calibration set's flat-darks are paired with.
  biasCount:
    type: integer
    required: true
    description: Number of bias frames to capture.
  darkCount:
    type: integer
    required: true
    description: Number of flat-dark frames to capture.
  binningX:
    type: integer
    required: false
    default: 1
    description: Horizontal pixel binning, if the camera supports it.
  binningY:
    type: integer
    required: false
    default: 1
    description: Vertical pixel binning, if the camera supports it.
  frameX:
    type: integer
    required: false
    description: Sub-frame left edge, in pixels. Set together with frameY/frameWidth/frameHeight, or omit all four for the full sensor.
  frameY:
    type: integer
    required: false
    description: Sub-frame top edge, in pixels. Set together with frameX/frameWidth/frameHeight, or omit all four for the full sensor.
  frameWidth:
    type: integer
    required: false
    description: Sub-frame width, in pixels. Set together with frameX/frameY/frameHeight, or omit all four for the full sensor.
  frameHeight:
    type: integer
    required: false
    description: Sub-frame height, in pixels. Set together with frameX/frameY/frameWidth, or omit all four for the full sensor.
steps:
  - step: repeat
    count: "{{ biasCount }}"
    steps:
      - step: capture_frame
        role: camera
        exposureSeconds: "{{ biasExposureSeconds }}"
        frameType: Bias
        gain: "{{ gain }}"
        offset: "{{ offset }}"
        binningX: "{{ binningX }}"
        binningY: "{{ binningY }}"
        frameX: "{{ frameX }}"
        frameY: "{{ frameY }}"
        frameWidth: "{{ frameWidth }}"
        frameHeight: "{{ frameHeight }}"
  - step: repeat
    count: "{{ darkCount }}"
    steps:
      - step: capture_frame
        role: camera
        exposureSeconds: "{{ flatExposureSeconds }}"
        frameType: Dark
        gain: "{{ gain }}"
        offset: "{{ offset }}"
        binningX: "{{ binningX }}"
        binningY: "{{ binningY }}"
        frameX: "{{ frameX }}"
        frameY: "{{ frameY }}"
        frameWidth: "{{ frameWidth }}"
        frameHeight: "{{ frameHeight }}"
