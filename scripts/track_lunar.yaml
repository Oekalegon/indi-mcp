id: track_lunar
name: Track at the lunar rate
description: >
  Selects lunar tracking on the rig's mount (TELESCOPE_TRACK_MODE.TRACK_LUNAR=On) and waits
  for it to take effect. A thin, reusable wrapper around the generic set_property/wait_for
  primitives so composed sequences can `run_script: track_lunar` instead of repeating the raw
  steps — see docs/Design.md's "Composing scripts" section. Separate from
  track_sidereal.yaml/track_solar.yaml/set_custom_tracking_rate.yaml (not one parameterized
  "set_track_mode" script) since parameter substitution only applies to element *values*, not
  element *names*, so a single script can't branch on which TELESCOPE_TRACK_MODE switch
  member to set based on a parameter.
pausable: false
steps:
  - step: set_property
    role: mount
    property: TELESCOPE_TRACK_MODE
    elements: { TRACK_LUNAR: "On" }
  - step: wait_for
    condition:
      role: mount
      property: TELESCOPE_TRACK_MODE
      operator: equals
      value: Ok
    timeoutSeconds: 30
