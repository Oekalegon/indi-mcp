id: capture_flat_sequence
name: Capture a sequence of flat frames
description: >
  Selects a filter and sets a fixed focuser position, then captures count
  flat frames — a composed sequence built from select_filter,
  set_focus_position, and capture_frame (see docs/Design.md's "Composing
  scripts" section). Unlike capture_light_sequence, this deliberately skips
  mount positioning and camera cooling: a flat frame only needs the filter
  and focus position to match the light frames it will calibrate, never a
  mount target or a specific sensor temperature. Pausable: capture_frame is
  the only step inside the repeat loop, so a pause request only ever lands
  between frames, never mid-exposure.

  gain/offset (INDIMCP-103) are optional, same "omit to leave the device's
  current setting alone" convention as capture_sensor_calibration_set — for
  ordinary flat-field calibration they're normally left unset (matching
  whatever the light frames used), but a sensor calibration sweep
  (run_flat_calibration_sweep) always supplies both explicitly, since a PTC
  needs flats at the specific gain/offset setting its matching flat-darks
  (capture_sensor_calibration_set, INDIMCP-102) were captured at.

  Assumes the flat panel (or other light source) this setting's flats need
  is already staged before this script runs — the script engine has no way
  to prompt for or verify that (see docs/SensorCalibration.md's "Decision:
  split capture into a bias/flat-dark script and a separate flat script");
  staging it is the caller's (or, for a client app driving a human operator,
  that app's) responsibility.

  binningX/binningY/frameX/frameY/frameWidth/frameHeight (INDIMCP-125) are
  optional, same defaults/omit convention as capture_frame.yaml itself:
  binning defaults to 1x1, and the sub-frame fields default to omitted
  (full sensor) — set all four together, or omit all four. A flat frame's
  binning/ROI must match the light frames it calibrates.
pausable: true
parameters:
  filterName:
    type: string
    required: true
    description: Name of the filter to select, matching the rig's filterWheel slots map.
  focusPosition:
    type: integer
    required: true
    description: >
      Target absolute focuser position, within the rig's focuser component's
      minPosition/maxPosition range — normally matching the light frames this
      calibrates.
  exposureSeconds:
    type: number
    required: true
    description: Exposure length per frame, in seconds.
  count:
    type: integer
    required: true
    description: Number of flat frames to capture.
  gain:
    type: number
    required: false
    description: >
      Sensor gain to hold for every frame in this sequence. Omit to leave the
      device's current setting alone — normal for ordinary flat-field
      calibration; a sensor calibration sweep always supplies this.
  offset:
    type: number
    required: false
    description: >
      Sensor offset to hold for every frame in this sequence. Omit to leave
      the device's current setting alone — same "normally omitted, always
      supplied by a sweep" convention as gain.
  binningX:
    type: integer
    required: false
    default: 1
    description: Horizontal pixel binning, if the camera supports it.
  binningY:
    type: integer
    required: false
    default: 1
    description: Vertical pixel binning, if the camera supports it.
  frameX:
    type: integer
    required: false
    description: Sub-frame left edge, in pixels. Set together with frameY/frameWidth/frameHeight, or omit all four for the full sensor.
  frameY:
    type: integer
    required: false
    description: Sub-frame top edge, in pixels. Set together with frameX/frameWidth/frameHeight, or omit all four for the full sensor.
  frameWidth:
    type: integer
    required: false
    description: Sub-frame width, in pixels. Set together with frameX/frameY/frameHeight, or omit all four for the full sensor.
  frameHeight:
    type: integer
    required: false
    description: Sub-frame height, in pixels. Set together with frameX/frameY/frameWidth, or omit all four for the full sensor.
steps:
  - step: select_filter
    role: filterWheel
    filterName: "{{ filterName }}"
  - step: set_focus_position
    role: focuser
    position: "{{ focusPosition }}"
  - step: repeat
    count: "{{ count }}"
    steps:
      - step: capture_frame
        role: camera
        exposureSeconds: "{{ exposureSeconds }}"
        frameType: Flat
        gain: "{{ gain }}"
        offset: "{{ offset }}"
        binningX: "{{ binningX }}"
        binningY: "{{ binningY }}"
        frameX: "{{ frameX }}"
        frameY: "{{ frameY }}"
        frameWidth: "{{ frameWidth }}"
        frameHeight: "{{ frameHeight }}"
