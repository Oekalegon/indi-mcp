id: capture_bias_sequence
name: Capture a sequence of bias frames
description: >
  Captures count bias frames back to back — a composed sequence built from
  nothing but capture_frame (see docs/Design.md's "Composing scripts"
  section). Unlike the light/flat/dark sequences, a bias frame needs none
  of mount position, filter, focus, or a specific sensor temperature — it's
  the shortest exposure the camera supports, with the shutter closed, so
  this script has no setup steps at all. Pausable: capture_frame is the
  only step inside the repeat loop, so a pause request only ever lands
  between frames, never mid-exposure.
pausable: true
parameters:
  exposureSeconds:
    type: number
    required: false
    default: 0.0
    description: Exposure length per frame, in seconds — normally the camera's shortest supported exposure.
  count:
    type: integer
    required: true
    description: Number of bias frames to capture.
steps:
  - step: repeat
    count: "{{ count }}"
    steps:
      - step: capture_frame
        role: camera
        exposureSeconds: "{{ exposureSeconds }}"
        frameType: Bias
