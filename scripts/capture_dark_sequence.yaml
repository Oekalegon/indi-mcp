id: capture_dark_sequence
name: Capture a sequence of dark frames
description: >
  Cools the camera to a target sensor temperature, then captures count dark
  frames — a composed sequence built from cool_camera and capture_frame (see
  docs/Design.md's "Composing scripts" section). Unlike
  capture_light_sequence, this deliberately skips mount positioning, filter
  selection, and focus: a dark frame is captured with the shutter/optical
  path irrelevant, so only the sensor temperature (and matching
  exposureSeconds) needs to match the light frames it will calibrate.
  Pausable: capture_frame is the only step inside the repeat loop, so a
  pause request only ever lands between frames, never mid-exposure.

  gain/offset (INDIMCP-110) are optional, same "omit to leave the device's
  current setting alone" convention as capture_flat_sequence's gain/offset
  (INDIMCP-103) — a dark frame's gain/offset must match the light frames
  it calibrates.

  binningX/binningY/frameX/frameY/frameWidth/frameHeight (INDIMCP-123) are
  optional, same defaults/omit convention as capture_frame.yaml itself:
  binning defaults to 1x1, and the sub-frame fields default to omitted
  (full sensor) — set all four together, or omit all four. A dark frame's
  binning/ROI must match the light frames it calibrates.
pausable: true
parameters:
  targetTempC:
    type: number
    required: false
    default: -10
    description: Target sensor temperature, in degrees Celsius — normally matching the light frames this calibrates.
  exposureSeconds:
    type: number
    required: true
    description: Exposure length per frame, in seconds — normally matching the light frames this calibrates.
  count:
    type: integer
    required: true
    description: Number of dark frames to capture.
  gain:
    type: number
    required: false
    description: >
      Sensor gain to hold for every frame in this sequence — normally
      matching the light frames this calibrates. Omit to leave the
      device's current setting alone.
  offset:
    type: number
    required: false
    description: >
      Sensor offset to hold for every frame in this sequence — normally
      matching the light frames this calibrates. Omit to leave the
      device's current setting alone, same "normally omitted" convention
      as gain.
  binningX:
    type: integer
    required: false
    default: 1
    description: Horizontal pixel binning, if the camera supports it.
  binningY:
    type: integer
    required: false
    default: 1
    description: Vertical pixel binning, if the camera supports it.
  frameX:
    type: integer
    required: false
    description: Sub-frame left edge, in pixels. Set together with frameY/frameWidth/frameHeight, or omit all four for the full sensor.
  frameY:
    type: integer
    required: false
    description: Sub-frame top edge, in pixels. Set together with frameX/frameWidth/frameHeight, or omit all four for the full sensor.
  frameWidth:
    type: integer
    required: false
    description: Sub-frame width, in pixels. Set together with frameX/frameY/frameHeight, or omit all four for the full sensor.
  frameHeight:
    type: integer
    required: false
    description: Sub-frame height, in pixels. Set together with frameX/frameY/frameWidth, or omit all four for the full sensor.
steps:
  - step: run_script
    script: cool_camera
    parameters: { targetTempC: "{{ targetTempC }}" }
  - step: repeat
    count: "{{ count }}"
    steps:
      - step: capture_frame
        role: camera
        exposureSeconds: "{{ exposureSeconds }}"
        frameType: Dark
        gain: "{{ gain }}"
        offset: "{{ offset }}"
        binningX: "{{ binningX }}"
        binningY: "{{ binningY }}"
        frameX: "{{ frameX }}"
        frameY: "{{ frameY }}"
        frameWidth: "{{ frameWidth }}"
        frameHeight: "{{ frameHeight }}"
