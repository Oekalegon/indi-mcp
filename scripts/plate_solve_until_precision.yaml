id: plate_solve_until_precision
name: Plate-solve, syncing and re-slewing until within a target tolerance
description: >
  Repeatedly plate-solves, syncs the mount, and re-slews toward the mount's own commanded
  target (TARGET_EOD_COORD) until the solved position is within toleranceArcsec of it, or
  maxAttempts is exhausted. A thin, reusable wrapper around the plate_solve step's own
  retry-toward-tolerance loop (INDIMCP-27/45/47) — see docs/PlateSolve.md. Run a slew step
  first, so TARGET_EOD_COORD is actually set to something meaningful.
pausable: false
parameters:
  exposureSeconds:
    type: number
    required: true
    description: Exposure length, in seconds, for each solve attempt's capture.
  toleranceArcsec:
    type: number
    required: false
    default: 30
    description: Stop once the solved position is within this many arcseconds of the mount's commanded target (TARGET_EOD_COORD).
  maxAttempts:
    type: integer
    required: false
    default: 3
    description: Give up after this many solve attempts without reaching toleranceArcsec.
  timeoutSeconds:
    type: number
    required: false
    default: 60
    description: Maximum time to wait for solve-field to solve each attempt.
steps:
  - step: plate_solve
    role: camera
    mountRole: mount
    exposureSeconds: "{{ exposureSeconds }}"
    syncMount: true
    toleranceArcsec: "{{ toleranceArcsec }}"
    maxAttempts: "{{ maxAttempts }}"
    timeoutSeconds: "{{ timeoutSeconds }}"
