id: cooler_on
name: Turn on the camera's active cooler
description: >
  Turns on the rig's camera cooler (CCD_COOLER.COOLER_ON=On) and waits for the driver
  to confirm — a thin, reusable wrapper so composed sequences or a standalone call can
  `run_script: cooler_on` instead of repeating the raw set_property/wait_for steps, see
  docs/Design.md's "Composing scripts" section (INDIMCP-84).

  Not every camera has active cooling. Unlike cool_camera's own internal cooler-on step
  (script_engine.py's _ensure_cooler_on, best-effort inside a larger sequence that should
  still work on an uncooled camera), this standalone script fails outright if CCD_COOLER
  is undefined on the device — a direct cooler_on call implies the operator expects the
  camera to actually have one.
pausable: false
steps:
  - step: set_property
    role: camera
    property: CCD_COOLER
    elements: { COOLER_ON: "On" }
  - step: wait_for
    condition:
      role: camera
      property: CCD_COOLER
      operator: equals
      value: Ok
    timeoutSeconds: 30
